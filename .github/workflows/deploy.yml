name: wxread

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  schedule:
    # 北京时间每天 01:07；实际启动时间可能延迟。
    - cron: '7 17 * * *'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-22.04
    environment: AutoRead
    timeout-minutes: 60
    env:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Check configuration and select duration
        env:
          WXREAD_CURL_BASH: ${{ secrets.WXREAD_CURL_BASH }}
        shell: bash
        run: |
          if [[ -z "$WXREAD_CURL_BASH" ]]; then
            echo "::error::请先配置 Repository Secret：WXREAD_CURL_BASH。"
            exit 1
          fi
          # 每次任务随机选择一次整数分钟数；每轮阅读约 30 秒。
          read_minutes="$(shuf -i 31-37 -n 1)"
          read_count="$((read_minutes * 2))"
          printf 'READ_NUM=%s\n' "$read_count" >> "$GITHUB_ENV"
          echo "配置预检通过；本次随机选择 ${read_minutes} 分钟，共 ${read_count} 次。"
          printf '### 本次阅读计划\n\n目标时长：%s 分钟；阅读次数：%s 次。\n' "$read_minutes" "$read_count" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install certifi==2024.8.30 charset-normalizer==3.4.0 idna==3.10 requests==2.32.3 urllib3==2.2.3

      - name: Run reading task
        env:
          WXREAD_CURL_BASH: ${{ secrets.WXREAD_CURL_BASH }}
          PUSH_METHOD: ${{ secrets.PUSH_METHOD }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SERVERCHAN_SPT: ${{ secrets.SERVERCHAN_SPT }}
        run: python main.py

  keepalive-job:
    name: Keepalive Workflow
    if: ${{ github.event_name == 'schedule' && needs.deploy.result == 'success' }}
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1.2.1
