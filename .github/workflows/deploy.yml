name: wxread

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  schedule:
    # 北京时间每天 01:07；实际启动时间可能延迟。
    - cron: '7 17 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'smoke：2 次短测；run：按 READ_NUM 正常运行'
        type: choice
        required: true
        default: smoke
        options:
          - smoke
          - run

jobs:
  deploy:
    runs-on: ubuntu-22.04
    environment: AutoRead
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'smoke' && 10 || 90 }}
    env:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: '1'
      READ_NUM: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'smoke' && '2' || vars.READ_NUM || '40' }}

    steps:
      - name: Check configuration
        env:
          WXREAD_CURL_BASH: ${{ secrets.WXREAD_CURL_BASH }}
        shell: bash
        run: |
          if [[ -z "$WXREAD_CURL_BASH" ]]; then
            echo "::error::请先配置 Repository Secret：WXREAD_CURL_BASH。"
            exit 1
          fi
          if [[ ! "$READ_NUM" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::READ_NUM 必须为正整数。"
            exit 1
          fi
          echo "配置预检通过；本次执行 ${READ_NUM} 次。"

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install certifi==2024.8.30 charset-normalizer==3.4.0 idna==3.10 requests==2.32.3 urllib3==2.2.3

      - name: Run reading task
        env:
          WXREAD_CURL_BASH: ${{ secrets.WXREAD_CURL_BASH }}
          PUSH_METHOD: ${{ secrets.PUSH_METHOD }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SERVERCHAN_SPT: ${{ secrets.SERVERCHAN_SPT }}
        run: python main.py

  keepalive-job:
    name: Keepalive Workflow
    if: ${{ github.event_name == 'schedule' && needs.deploy.result == 'success' }}
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1.2.1
